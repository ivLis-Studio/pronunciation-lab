<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발음 표기 변환기</title>
<style>
:root{--paper:#f5f3ed;--white:#fffefa;--ink:#20251c;--muted:#5f6658;--line:#d9ddd1;--accent:#294c36;--soft:#e5ede1}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Segoe UI","Malgun Gothic",system-ui,sans-serif}
.wrap{width:min(1120px,100% - 48px);margin:auto}
header{padding:52px 0 26px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px}
.locale-field{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.locale-field select{max-width:100%}
:lang(ar) h1,:lang(fa) h1,:lang(km) h1,:lang(or) h1{letter-spacing:normal}
h1{font-size:clamp(32px,6vw,56px);margin:0 0 7px;letter-spacing:-.055em;line-height:1.13}
header p{margin:0;color:var(--muted)}
main{padding-bottom:40px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:22px}
.toolbar,.result-head,.card-head,.input-footer{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toolbar{margin-bottom:14px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
select{max-width:100%}
label{font-size:14px;font-weight:650}
button,select,textarea{font:inherit;color:inherit}
select,button{border:1px solid var(--line);background:var(--white);border-radius:9px;padding:7px 11px;min-height:39px}
button{cursor:pointer}
button:hover{background:var(--soft)}
button[aria-pressed=true]{background:var(--soft);border-color:#b7c8b7;font-weight:700}
button:disabled{opacity:.65;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.modes{display:flex;gap:5px}
textarea{display:block;width:100%;resize:vertical;min-height:94px;border:1px solid var(--line);border-radius:10px;background:#faf9f4;padding:14px 16px;line-height:1.55;font-size:20px}
.input-footer{margin-top:11px;align-items:start}
.number-option{display:flex;align-items:center;gap:6px;font-size:14px;margin:8px 0 2px}
.number-option[hidden]{display:none}
.primary{background:var(--accent);color:white;border-color:var(--accent);font-weight:650;padding-inline:21px}
.primary:hover{background:#376247}
.hint,.status{color:var(--muted);font-size:13px;margin:0}
.status{margin:10px 0 0}
.status:empty{display:none}
.status[data-error=true]{color:#842b25}
.ipa-box{margin-top:12px;padding:13px 15px;border-radius:10px;background:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}
.ipa-label{font-weight:700;font-size:13px;margin-inline-end:8px}
#ipa{font:500 16px/1.45 ui-monospace,"Segoe UI",monospace}
.result-head{margin:26px 0 12px;align-items:baseline;flex-wrap:wrap}
h2{font-size:24px;margin:0;letter-spacing:-.04em}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:13px 14px;min-width:0}
.card[data-key=true]{border-color:#a4bba9}
.card h3{margin:0;font-size:14px;line-height:1.35}
.script{color:var(--muted);font-size:12px;margin-top:2px}
.copy{font-size:12px;min-height:30px;padding:3px 9px;flex-shrink:0}
.reading{font-size:22px;line-height:1.42;font-weight:600;margin:9px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.extra{color:var(--accent);font-size:14px;margin:8px 0 0;overflow-wrap:anywhere}
footer{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:13px}
a{color:var(--accent)}
[hidden]{display:none!important}
@media(max-width:790px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.wrap{width:calc(100% - 28px)}header{padding:30px 0 20px}.panel{padding:14px}.grid{grid-template-columns:minmax(0,1fr)}.reading{font-size:20px}.input-footer{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1 data-i18n="title">발음 표기 변환기</h1><p data-i18n="intro">한 언어의 소리를 다른 언어 화자가 읽을 수 있는 표기로 옮깁니다.</p></div>
  <div class="locale-field"><label for="ui-language" data-i18n="language">화면 언어</label><select id="ui-language"></select></div>
</header>
<main>
<form class="panel" id="converter">
  <div class="toolbar">
    <div class="field">
      <label for="source" data-i18n="source">원어</label><select id="source"></select>
      <label for="variant" id="variant-label" data-i18n="variant" hidden>사전 변형</label><select id="variant" hidden></select>
      <button type="button" id="example" data-i18n="example">예문 넣기</button>
    </div>
    <div class="modes" role="group" aria-label="입력 방식" data-i18n-label="mode">
      <button type="button" data-mode="text" data-i18n="textMode" aria-pressed="true">원문 입력</button>
      <button type="button" data-mode="ipa" data-i18n="ipaMode" aria-pressed="false">IPA 입력</button>
    </div>
  </div>
  <textarea id="input" aria-label="원문" maxlength="1000" spellcheck="false" dir="auto">안녕하세요</textarea>
  <label class="number-option" id="number-option"><input type="checkbox" id="read-numbers"> <span data-i18n="numbers">문장 속 정수도 발음으로 표기</span></label>
  <div class="input-footer"><p class="hint" id="input-hint" data-i18n="textHint">선택한 원어의 IPA 사전을 불러옵니다. 입력한 문장은 브라우저에서 처리됩니다.</p><button class="primary" id="convert" data-i18n="convert">변환</button></div>
  <p class="status" id="status" role="status"></p>
  <div class="ipa-box" id="ipa-box" hidden><span class="ipa-label">IPA</span><bdi id="ipa" dir="ltr"></bdi></div>
</form>
<section id="results" hidden aria-labelledby="result-title">
  <div class="result-head"><h2 id="result-title" data-i18n="results">발음 표기</h2><p class="hint" data-i18n="resultHint">24개 언어 · 발음 근사 표기</p></div>
  <div class="grid" id="cards"></div>
</section>
<footer>
  <a href="https://github.com/ivLis-Studio/pronunciation-lab" data-i18n="code">소스 코드</a>
  <a href="https://github.com/ivLis-Studio/pronunciation-lab/blob/main/NOTICE.md" data-i18n="credits">출처 및 라이선스</a>
</footer>
</main>
</div>
<script type="module" src="./dist/demo.mjs"></script>
</body>
</html>
